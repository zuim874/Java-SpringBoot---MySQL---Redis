# ?????????????????
spring.application.name=demoApplication

# ??????8080???8090????
server.port=8080

# ========== MySQL?????????????????? ==========
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/springbootdb?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=123456

# ========== MyBatis-Plus?? ==========
mybatis-plus.mapper-locations=classpath*:/mapper/**/*.xml
mybatis-plus.global-config.db-config.id-type=auto

# ========== Redis配置 ==========
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.database=0

# ??SpringBoot???Logo??????
spring.main.banner-mode=off

# ========== JWT 配置 ==========
jwt.secret=YourSuperSecretKeyForJWTTokenGenerationMustBeAtLeast32CharactersLong
# one day
jwt.expiration-ms=21600000
# examing:10 seconds
#jwt.expiration-ms=10000

# ========== 逻辑删除 配置 =======
# MyBatis-Plus 逻辑删除配置（0，1状态一定要这样配置，否则会报错，MyBatis-Plus 默认约定）
mybatis-plus.global-config.db-config.logic-delete-field=is_deleted
mybatis-plus.global-config.db-config.logic-delete-value=1
mybatis-plus.global-config.db-config.logic-not-delete-value=0