# ==================== 应用基础配置 ====================
spring.application.name=demoApplication
server.port=8080
spring.main.banner-mode=off
spring.profiles.active=dev

# ==================== MySQL 数据库 ====================
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/springbootdb?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD:}
# SQL实际执行输出日志
#mybatis-plus.configuration.log-impl=org.apache.ibatis.logging.stdout.StdOutImpl

# ==================== HikariCP 连接池配置 ====================
# 最大连接数（根据业务并发量调整，一般 10~30）
spring.datasource.hikari.maximum-pool-size=20
# 最小空闲连接数（保持几个连接随时待命）
spring.datasource.hikari.minimum-idle=5
# 空闲连接超时（毫秒，超过这个时间没被使用就释放）
spring.datasource.hikari.idle-timeout=600000
# 连接最大存活时间（毫秒，建议小于 MySQL 的 wait_timeout）
spring.datasource.hikari.max-lifetime=1800000
# 从连接池获取连接的超时时间（毫秒，超时抛异常）
spring.datasource.hikari.connection-timeout=30000
# 连接池名称（方便监控）
spring.datasource.hikari.pool-name=MyHikariCP

# ==================== MyBatis-Plus ====================
mybatis-plus.mapper-locations=classpath*:/mapper/**/*.xml
mybatis-plus.global-config.db-config.id-type=auto
mybatis-plus.global-config.db-config.logic-delete-field=is_deleted
mybatis-plus.global-config.db-config.logic-delete-value=1
mybatis-plus.global-config.db-config.logic-not-delete-value=0

# ==================== Redis ====================
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.database=0
# spring.data.redis.password=
spring.data.redis.lettuce.pool.enabled=true
spring.data.redis.lettuce.pool.max-active=20
spring.data.redis.lettuce.pool.max-idle=20
spring.data.redis.lettuce.pool.min-idle=5
spring.data.redis.lettuce.pool.max-wait=2000ms
# 连接超时时间（毫秒，建立连接的超时）
spring.data.redis.timeout=3000ms
# 命令执行超时时间（毫秒，发送命令后等待响应的超时）
spring.data.redis.lettuce.shutdown-timeout=100ms
# 客户端名称（方便 Redis 监控里识别）
spring.data.redis.client-name=my-spring-boot-app
# 自定义参数
# 过期时间(分钟)
test.redisTimeOut=5
# 验证码发送锁(秒)
test.redisCodeTimeOut=10

# ==================== JWT ====================
jwt.secret=${JWT_SECRET:}
jwt.expiration-ms=21600000

# ==================== 后端日志 ====================
#logging.level.org.springframework.security=DEBUG
#logging.level.org.springframework.web=DEBUG

# ==================== 邮件服务 ====================
spring.mail.host=smtp.qq.com
spring.mail.port=465
spring.mail.protocol=smtps
spring.mail.default-encoding=UTF-8
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.ssl.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
spring.mail.properties.mail.debug=true

# ==================== 文件上传（头像等） ====================
# 单文件最大 10MB，单次请求最大 10MB
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
# 上传文件存放根目录（相对项目根目录，会被 /uploads/** 静态映射）
app.upload.dir=./uploads/

# 开启异步支持
spring.task.execution.pool.core-size=5
spring.task.execution.pool.max-size=10
spring.task.execution.pool.queue-capacity=25

# ========== Tomcat 完整配置 ==========
# --- 线程池配置 ---
# 最大工作线程数（处理请求的最大线程数）
server.tomcat.threads.max=2000
# 核心工作线程数（初始线程数）
server.tomcat.threads.core=600
# 线程空闲超时时间（毫秒，默认 60000）
server.tomcat.threads.keep-alive=60000
# --- 连接配置 ---
# 最大连接数（可同时接受的最大连接数）
server.tomcat.max-connections=8192
# 等待队列长度（连接数超过 max-connections 时的排队数）
server.tomcat.accept-count=2000
# 连接超时时间（毫秒）
server.tomcat.connection-timeout=10000
# --- Keep-Alive 配置 ---
# keep-alive 超时时间（毫秒）
server.tomcat.keep-alive-timeout=20000
# 单个连接最大 keep-alive 请求数
server.tomcat.max-keep-alive-requests=100
# --- 其他配置 ---
# 是否启用端口复用（默认 true）
server.tomcat.relaxed-path-chars=
# URI 编码
server.tomcat.uri-encoding=UTF-8
# 是否启用压缩
server.tomcat.compression=on
server.tomcat.compression-min-size=2048
server.tomcat.compressable-mime-types=text/html,text/xml,text/plain,application/javascript,application/json
# 访问日志
server.tomcat.accesslog.enabled=true
server.tomcat.accesslog.directory=logs
server.tomcat.accesslog.pattern=%h %l %u %t "%r" %s %b %D

# ========== ActiveMQ 配置 ==========
# 连接地址（默认）
spring.activemq.broker-url=tcp://localhost:61616
# 用户名和密码（默认）
spring.activemq.user=admin
spring.activemq.password=admin
# 是否启用内存中的 ActiveMQ（开发测试用）
spring.activemq.in-memory=false
# 连接池配置
spring.activemq.pool.enabled=true
spring.activemq.pool.max-connections=10
spring.activemq.pool.idle-timeout=30000

# ========== JMS 配置 ==========
# 是否启用 JMS
spring.jms.enabled=true
# 是否支持事务
spring.jms.cache-session=true
# 发布订阅模式
spring.jms.pub-sub-domain=false
# 消息确认模式：AUTO, CLIENT, DUPS_OK
spring.jms.listener.session.acknowledge-mode=auto
# 并发消费者数
spring.jms.listener.min-concurrency=5
spring.jms.listener.max-concurrency=20

# ==================== 自定义配置项 ====================
# 是否用户初始化（增加测试用户）
test.username.status=true
# 是否开启密码强度校验（注册过程中）
test.passwordstrength.status=true
# 是否开启注册邮箱校验
test.registerEmailcheck.status=true
# 是否开启注册邮箱验证码校验
test.registerCodeCheck.status=true
# 是否开启恢复邮箱校验
test.recoverEmailCheck.status=true
# 是否开启恢复邮箱验证码校验
test.recoverCodeCheck.status=true
# 是否开启注销邮箱校验
test.deleteEmailCheck.status=true
# 是否开启注销邮箱验证码校验
test.deleteCodeCheck.status=true
# 换绑邮箱验证码校验开关（高危操作，默认开启）
test.changeEmailCodeCheck.status=true
# 测试邮箱（用于 EmailTest）
test.mail.username=${TEST_MAIL_USERNAME:}
# 管理员权限码
test.adminCheckCode=abcd