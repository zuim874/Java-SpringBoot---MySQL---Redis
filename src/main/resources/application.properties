# 测试环境
spring.profiles.active=test

# 应用名称
spring.application.name=demoApplication

# 服务端口，默认8080，如需修改改为8090等
server.port=8080

# ========== MySQL数据库连接配置 ==========
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/springbootdb?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=123456

# ========== MyBatis-Plus配置 ==========
mybatis-plus.mapper-locations=classpath*:/mapper/**/*.xml
mybatis-plus.global-config.db-config.id-type=auto

# ========== Redis配置 ==========
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.database=0
spring.data.redis.password=
# 连接池配置（必须放在 lettuce.pool 下）
spring.data.redis.lettuce.pool.enabled=true
spring.data.redis.lettuce.pool.max-active=20
spring.data.redis.lettuce.pool.max-idle=10
spring.data.redis.lettuce.pool.min-idle=5
spring.data.redis.lettuce.pool.max-wait=2000ms

# 关闭SpringBoot启动Logo横幅
spring.main.banner-mode=off

# ========== JWT 配置 ==========
jwt.secret=YourSuperSecretKeyForJWTTokenGenerationMustBeAtLeast32CharactersLong
# 有效期 一天
jwt.expiration-ms=21600000
# 测试使用:10秒
#jwt.expiration-ms=10000

# ========== 逻辑删除 配置 =======
# MyBatis-Plus 逻辑删除配置（0，1状态一定要这样配置，否则会报错，MyBatis-Plus 默认约定）
mybatis-plus.global-config.db-config.logic-delete-field=is_deleted
mybatis-plus.global-config.db-config.logic-delete-value=1
mybatis-plus.global-config.db-config.logic-not-delete-value=0

# ==================== 基础配置 ====================
# 邮件服务器地址（不同邮箱服务商不同）
spring.mail.host=smtp.qq.com
# 邮件服务器端口（SSL：465，TLS：587）
spring.mail.port=465
# 你的邮箱账号
spring.mail.username=3298140377@qq.com
# 邮箱授权码（不是登录密码！）
spring.mail.password=laskxsznxrjocjdf
# 协议类型（使用SSL时用smtps）
spring.mail.protocol=smtps
# 默认编码（解决中文乱码）
spring.mail.default-encoding=UTF-8
# ==================== 高级配置 ====================
# 开启身份验证
spring.mail.properties.mail.smtp.auth=true
# 开启SSL加密（port=465时必须开启）
spring.mail.properties.mail.smtp.ssl.enable=true
# 开启STARTTLS（port=587时需要）
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
# 设置超时时间（单位：毫秒）
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
# 开启调试日志（开发时建议开启，方便排查问题）
spring.mail.properties.mail.debug=true