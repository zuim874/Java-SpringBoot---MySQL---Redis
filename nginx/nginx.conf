worker_processes 1;

events {
    worker_connections 1024;
}

http {
    include mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;

    # ==============================================
    # Rate Limiting Zones
    # ==============================================
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=600r/m;
    limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

    server {
        listen 8081;
        server_name localhost;

        access_log logs/access.log;
        error_log logs/error.log;

        # ==============================================
        # API Proxy + Rate Limiting
        # ==============================================
        location /api/ {
            # Rate limiting rules（rate=600r/m + burst=100：仅兜底防爬虫级攻击，正常浏览不触发；
            # 精确限流由后端 @RateLimit 按接口独立控制）
            limit_req zone=api_limit burst=100 nodelay;
            limit_conn conn_limit 10;
            # 限流/限连超限时返回标准 429（不能再用 444 空响应，否则前端会解析失败/空白）
            limit_req_status 429;
            limit_conn_status 429;

            # Timeouts
            proxy_connect_timeout 10s;
            proxy_read_timeout 10s;

            # Forward to Spring Boot
            proxy_pass http://127.0.0.1:8080;

            # Headers
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # ==============================================
        # File Uploads (Avatar, etc.)
        # ==============================================
        location /uploads/ {
            proxy_pass http://127.0.0.1:8080;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # ==============================================
        # Static Files (Upload Directory)
        # ==============================================
        location /upload/ {
            alias D:/upload/;
        }
    }
}
